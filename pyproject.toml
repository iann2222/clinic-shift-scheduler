[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-shift-scheduler"
version = "0.1.0"
description = "Versioned data model and CP-SAT feasibility for clinic scheduling"
requires-python = ">=3.11"
dependencies = [
    # 9.14/9.15 native-crash on the current Windows + Python 3.12 setup;
    # keep the verified stable release until an upgrade passes solver regression tests.
    "ortools~=9.12.4544",
    "openpyxl>=3.1,<4",
    "pandas>=2.2.3,<3",
    "reportlab>=4,<5",
]

[project.scripts]
clinic-shift-scheduler = "clinic_shift_scheduler.cli:main"

[project.optional-dependencies]
test = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinic_shift_scheduler = ["py.typed", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
