[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-shift-scheduler"
version = "0.1.0"
description = "Versioned CP-SAT clinic shift scheduler with validated outputs"
requires-python = ">=3.11"
dependencies = [
    # 9.14/9.15 native-crash on the current Windows + Python 3.12 setup;
    # keep the verified stable release until an upgrade passes solver regression tests.
    "ortools~=9.12.4544",
    "openpyxl>=3.1,<4",
    "reportlab>=4,<5",
]

[project.scripts]
clinic-shift-scheduler = "clinic_shift_scheduler.cli:main"

[project.optional-dependencies]
gui = [
    # Qt Widgets is provided by the official PySide6 Essentials distribution.
    # Keep the verified GUI baseline pinned for Windows packaging reproducibility.
    "PySide6-Essentials==6.8.3",
]
test = [
    "pypdf>=5,<7",
    "pytest>=8,<10",
]
release = [
    "fonttools>=4.59,<5",
    "pyinstaller==6.21.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinic_shift_scheduler = [
    "py.typed",
    "schemas/*.json",
    "resources/fonts/*.ttf",
    "gui/styles/*.qss",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "."]
